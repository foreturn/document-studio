<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DECK_TITLE}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --spring-easing: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.65; transform: scale(1.12) translate(15px, -15px); }
    }
    .animate-glow { animation: pulseGlow 9s ease-in-out infinite; }
    @keyframes kenBurnsSlow {
      0% { transform: scale(1.0) translate(0, 0); }
      50% { transform: scale(1.07) translate(-1%, 1.5%); }
      100% { transform: scale(1.0) translate(0, 0); }
    }
    .ken-burns {
      animation: kenBurnsSlow 18s ease-in-out infinite;
      transition: transform 0.8s var(--spring-easing);
    }
    .slide {
      display: none;
      opacity: 0;
      transform: scale(0.96) translateY(20px);
      transition: opacity 0.55s var(--spring-easing), transform 0.55s var(--spring-easing);
      perspective: 1200px;
    }
    .slide.active {
      display: flex;
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .slide .anim-stagger-1,
    .slide .anim-stagger-2,
    .slide .anim-stagger-3,
    .slide .anim-stagger-4,
    .slide .anim-stagger-5 {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s var(--spring-easing), transform 0.6s var(--spring-easing);
    }
    .slide.active .anim-stagger-1 { opacity: 1; transform: translateY(0); transition-delay: 0.08s; }
    .slide.active .anim-stagger-2 { opacity: 1; transform: translateY(0); transition-delay: 0.18s; }
    .slide.active .anim-stagger-3 { opacity: 1; transform: translateY(0); transition-delay: 0.28s; }
    .slide.active .anim-stagger-4 { opacity: 1; transform: translateY(0); transition-delay: 0.38s; }
    .slide.active .anim-stagger-5 { opacity: 1; transform: translateY(0); transition-delay: 0.48s; }

    .glass-card {
      background: rgba(18, 22, 34, 0.70);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s var(--spring-easing), border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .glass-card:hover {
      border-color: rgba(0, 242, 254, 0.3);
      box-shadow: 0 30px 70px rgba(0, 242, 254, 0.08);
    }
    .shimmer-badge {
      background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(0,242,254,0.15), rgba(255,255,255,0.03));
      background-size: 200% 100%;
      animation: shimmer 4s infinite linear;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body class="bg-[#07080c] text-slate-100 min-h-screen overflow-hidden flex flex-col items-center justify-center select-none font-sans">
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-[20%] -left-[10%] w-[650px] h-[650px] bg-cyan-600/18 rounded-full blur-[140px] animate-glow"></div>
    <div class="absolute -bottom-[20%] -right-[10%] w-[700px] h-[700px] bg-purple-700/18 rounded-full blur-[150px] animate-glow" style="animation-delay: -4.5s;"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#ffffff0a_1px,transparent_1px)] [background-size:28px_28px] opacity-40"></div>
  </div>

  <header class="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-8 py-5 border-b border-white/5 bg-black/25 backdrop-blur-xl">
    <div class="flex items-center space-x-3">
      <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_12px_#00F2FE]"></div>
      <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold">{{DECK_TITLE}}</span>
    </div>
    <div class="flex items-center space-x-4">
      <div class="w-52 h-1.5 bg-white/10 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 via-sky-400 to-purple-500 transition-all duration-500 ease-out" style="width: 14%;"></div>
      </div>
      <span id="slide-counter" class="text-xs font-mono text-slate-400 tracking-wider">01 / {total_slides:02d}</span>
    </div>
  </header>

  <main class="relative z-10 w-full max-w-7xl h-[82vh] px-6 py-4 flex items-center justify-center">
    {{SLIDES_HTML}}
  </main>

  <footer class="fixed bottom-6 z-50 flex items-center space-x-4 bg-white/[0.06] backdrop-blur-xl border border-white/10 px-5 py-2.5 rounded-full shadow-2xl">
    <button id="btn-prev" class="p-2 rounded-full hover:bg-white/10 text-slate-300 hover:text-white transition active:scale-90">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="h-4 w-[1px] bg-white/10"></div>
    <span id="current-section-name" class="text-xs font-medium text-slate-300 px-2 min-w-[140px] text-center">01 序章</span>
    <div class="h-4 w-[1px] bg-white/10"></div>
    <button id="btn-next" class="p-2 rounded-full hover:bg-white/10 text-slate-300 hover:text-white transition active:scale-90">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </button>
  </footer>

  <script>
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const counter = document.getElementById('slide-counter');
    const progressBar = document.getElementById('progress-bar');
    const sectionName = document.getElementById('current-section-name');
    let currentIndex = 0;

    function triggerCounters(slideElement) {
      const counters = slideElement.querySelectorAll('.counter-num');
      counters.forEach(counter => {
        const target = parseFloat(counter.getAttribute('data-target'));
        const decimals = parseInt(counter.getAttribute('data-decimals') || '0', 10);
        let start = 0;
        const duration = 1200;
        const startTime = performance.now();

        function updateCount(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          const currentVal = start + (target - start) * easeProgress;
          counter.textContent = currentVal.toFixed(decimals);

          if (progress < 1) {
            requestAnimationFrame(updateCount);
          } else {
            counter.textContent = target.toFixed(decimals);
          }
        }
        requestAnimationFrame(updateCount);
      });
    }

    function updateSlide(index) {
      if (index < 0 || index >= slides.length) return;
      slides[currentIndex].classList.remove('active');
      currentIndex = index;
      slides[currentIndex].classList.add('active');

      const total = slides.length;
      counter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
      progressBar.style.width = `${((currentIndex + 1) / total) * 100}%`;
      sectionName.textContent = slides[currentIndex].dataset.title || `Slide ${currentIndex + 1}`;
      triggerCounters(slides[currentIndex]);
    }

    prevBtn.addEventListener('click', () => updateSlide(currentIndex - 1));
    nextBtn.addEventListener('click', () => updateSlide(currentIndex + 1));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        updateSlide(currentIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        updateSlide(currentIndex - 1);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (slides.length > 0) triggerCounters(slides[0]);
    });
  </script>
</body>
</html>
